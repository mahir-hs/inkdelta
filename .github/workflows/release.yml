name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The token must be allowed to create the release and upload the installers to it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest        # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - os: macos-15-intel      # Intel (the old macos-13 runner no longer exists)
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages, so the app only installs updates that really come from this project.
          # (The key and its password are repository secrets; the public half is in tauri.conf.json.)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional, for a smoother first run on macOS: APPLE_CERTIFICATE, APPLE_ID, ... (needs a paid Apple account)
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inkdelta ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: true   # uploads latest.json, the file the app checks for new versions
          args: ${{ matrix.args }}
